[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "derivlib"
version = "0.1.0"
description = "Option pricing (Black-Scholes, Monte Carlo, Crank-Nicolson), Greeks, implied volatility and delta-hedging in Python"
authors = [{ name = "Oscar Cray" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
market = ["yfinance>=0.2"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["derivlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
